[project]
name = "receipts"
version = "0.1.0"
description = "Auditable AI code review: every finding has a receipt"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
receipts = "receipts.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["receipts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
